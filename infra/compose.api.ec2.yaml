# Implantação da API e do dashboard na EC2.
services:
  api:
    image: ${IMAGE}
    container_name: estacao-api
    env_file:
      - /opt/estacao-api/.env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - estacao_dados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:?Defina FRONTEND_IMAGE}
    container_name: estacao-dashboard
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  estacao_dados:
    external: true
    name: ${EXTERNAL_DOCKER_NETWORK}
