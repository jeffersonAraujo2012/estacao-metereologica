name: API e Dashboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  test_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, test_frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: api-publish-main
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.images.outputs.api }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and publish API and frontend images
        id: images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_package="ghcr.io/${GITHUB_REPOSITORY,,}"
          frontend_package="$api_package-frontend"
          api_ref="$api_package:api-$GITHUB_SHA"
          frontend_ref="$frontend_package:frontend-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$api_ref" -t "$api_package:api-latest" backend
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$frontend_ref" -t "$frontend_package:frontend-latest" frontend
          docker push "$api_ref"
          docker push "$frontend_ref"
          docker push "$api_package:api-latest"
          docker push "$frontend_package:frontend-latest"
          printf 'api=%s\nfrontend=%s\n' "$api_ref" "$frontend_ref" >> "$GITHUB_OUTPUT"

  deploy:
    if: vars.ENABLE_EC2_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: api-deploy-ec2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Deploy API and dashboard to EC2
        env:
          IMAGE: ${{ needs.publish.outputs.api_image }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KEY_PASSPHRASE: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          : "${EC2_HOST:?Configure EC2_HOST}" "${EC2_USER:?Configure EC2_USER}"
          : "${EC2_SSH_PRIVATE_KEY:?Configure EC2_SSH_PRIVATE_KEY}"
          : "${EC2_SSH_KNOWN_HOSTS:?Configure EC2_SSH_KNOWN_HOSTS}"

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset EC2_SSH_PRIVATE_KEY

          agent_env=$(ssh-agent -s -a "$ssh_dir/agent.sock")
          eval "$agent_env" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$ssh_dir"' EXIT
          cat > "$ssh_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          # Stop ssh-add from retrying the same incorrect passphrase.
          [ -n "${EC2_SSH_KEY_PASSPHRASE:-}" ] && [ ! -e "$0.used" ] || exit 1
          : > "$0.used"
          printf '%s\n' "$EC2_SSH_KEY_PASSPHRASE"
          ASKPASS
          chmod 700 "$ssh_dir/askpass"
          if ! SSH_ASKPASS="$ssh_dir/askpass" SSH_ASKPASS_REQUIRE=force ssh-add -q "$ssh_dir/key" </dev/null; then
            printf 'Não foi possível carregar EC2_SSH_PRIVATE_KEY. Se a chave estiver cifrada, confira EC2_SSH_KEY_PASSPHRASE.\n' >&2
            exit 1
          fi
          unset EC2_SSH_KEY_PASSPHRASE
          ssh-add -L > "$ssh_dir/key.pub"
          ssh-keygen -lf "$ssh_dir/key.pub"

          ssh_options=(-i "$ssh_dir/key.pub" -o IdentitiesOnly=yes -o "IdentityAgent=$SSH_AUTH_SOCK" -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15)
          target="$EC2_USER@$EC2_HOST"

          compose_file="compose-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.yaml"
          scp "${ssh_options[@]}" infra/compose.api.ec2.yaml "$target:/opt/estacao-api/$compose_file"
          ssh "${ssh_options[@]}" "$target" "bash -s -- '$IMAGE' '$FRONTEND_IMAGE' '$compose_file'" <<'REMOTE'
          set -euo pipefail
          cd /opt/estacao-api
          IMAGE=$1
          FRONTEND_IMAGE=$2
          compose_file=$3
          trap 'rm -f -- "$compose_file"' EXIT
          compose=(sudo -n env "IMAGE=$IMAGE" "FRONTEND_IMAGE=$FRONTEND_IMAGE"
            docker compose -p estacao-api --env-file .env)
          "${compose[@]}" -f "$compose_file" config --quiet
          "${compose[@]}" -f "$compose_file" pull api frontend
          mv -f -- "$compose_file" compose.yaml
          "${compose[@]}" -f compose.yaml up -d --no-deps api frontend

          for url in \
            http://127.0.0.1:8000/ready \
            http://127.0.0.1:8080/ \
            'http://127.0.0.1:8080/api/v1/leituras?limite=1'; do
            printf 'Verificando %s\n' "$url"
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --retry-connrefused --max-time 10 --output /dev/null "$url"
          done
          REMOTE
